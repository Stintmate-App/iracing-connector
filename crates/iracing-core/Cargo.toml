[package]
name = "iracing-core"
description = "Core types of the iRacing connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The synthetic layout, session text builder and scenarios for other crates' tests.
testing = ["irsdk/testing"]

[dependencies]
irsdk.workspace = true
stintmate-connector-platform.workspace = true
stintmate-connector-resources.workspace = true

[dev-dependencies]
# The tests use the `testing` module.
iracing-core = { path = ".", features = ["testing"] }
irsdk = { workspace = true, features = ["testing"] }
stintmate-connector-control.workspace = true
stintmate-connector-wire.workspace = true
serde_json.workspace = true
