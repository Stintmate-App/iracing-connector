[workspace]
resolver = "3"
members = [
    "crates/irsdk",
    "crates/iracing-core",
    "bins/iracing-connector-ui",
    "bins/iracing-connector-window",
    "bins/iracing-recorder",
    "tools/measure",
    "tools/probe",
    "tools/replay",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Stintmate-App/iracing-connector"
authors = ["The Stintmate authors"]
publish = false

[workspace.dependencies]
irsdk = { path = "crates/irsdk" }
iracing-core = { path = "crates/iracing-core" }
# The IPC library, pinned to a release tag like any dependency.
stintmate-ipc = { git = "https://github.com/Stintmate-App/stintmate-ipc", tag = "v0.3.3" }
stintmate-ipc-check = { git = "https://github.com/Stintmate-App/stintmate-ipc", tag = "v0.3.3" }
# The shared connector runtime, pinned to a release tag.
stintmate-connector-platform = { git = "https://github.com/Stintmate-App/connector-runtime", tag = "v0.1.3" }
stintmate-connector-resources = { git = "https://github.com/Stintmate-App/connector-runtime", tag = "v0.1.3" }
stintmate-connector-i18n = { git = "https://github.com/Stintmate-App/connector-runtime", tag = "v0.1.3" }
stintmate-connector-wire = { git = "https://github.com/Stintmate-App/connector-runtime", tag = "v0.1.3" }
stintmate-connector-link = { git = "https://github.com/Stintmate-App/connector-runtime", tag = "v0.1.3" }
stintmate-connector-control = { git = "https://github.com/Stintmate-App/connector-runtime", tag = "v0.1.3" }
stintmate-connector-window = { git = "https://github.com/Stintmate-App/connector-runtime", tag = "v0.1.3" }
stintmate-connector-testing = { git = "https://github.com/Stintmate-App/connector-runtime", tag = "v0.1.3" }
thiserror = "2"
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
windows-sys = "0.61"
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
