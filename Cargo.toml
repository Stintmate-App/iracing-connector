[workspace]
resolver = "3"
members = [
    "crates/irsdk",
    "crates/iracing-core",
    "tools/probe",
    "tools/replay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Stintmate-App/iracing-connector"
authors = ["The Stintmate authors"]
publish = false

[workspace.dependencies]
irsdk = { path = "crates/irsdk" }
iracing-core = { path = "crates/iracing-core" }
thiserror = "2"
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
